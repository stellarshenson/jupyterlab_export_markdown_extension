[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_export_markdown_extension"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.21,<3",
    "markdown>=3.11,<4",
    "python-docx>=1.2,<2",
    "htmldocx>=0.0.6,<1",
    "beautifulsoup4>=4.15,<5",
    "playwright>=1.64,<2",
    "Pillow>=13.0,<14",
    "reportlab>=5.1,<6",
    "latex2mathml>=3.81,<4",
    "matplotlib>=3.11,<4",
    "Pygments>=2.21,<3"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.scripts]
jupyterlab-export-markdown-extension = "jupyterlab_export_markdown_extension.cli:main"

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.6,<5",
    "jupyter-builder>=1.2.0,<2",
]
test = [
    "coverage",
    "pymupdf",
    "pypdf",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.11,<1"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = [
    "jupyterlab_export_markdown_extension/labextension",
    "jupyterlab_export_markdown_extension/vendor",
]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel]
# Both are build output and so git-ignored; name them here or the wheel ships
# without them. The mermaid bundle is what renders a diagram server-side when
# the export comes from the REST API rather than the browser.
artifacts = ["jupyterlab_export_markdown_extension/vendor"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_export_markdown_extension/labextension" = "share/jupyter/labextensions/@stellarshenson/jupyterlab-export-markdown-extension"
"install.json" = "share/jupyter/labextensions/@stellarshenson/jupyterlab-export-markdown-extension/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"
".agents/skills/jupyterlab-export-markdown-extension" = "share/jupyter/agents/skills/jupyterlab-export-markdown-extension"

[tool.hatch.build.hooks.version]
path = "jupyterlab_export_markdown_extension/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_export_markdown_extension/labextension/static/style.js",
    "jupyterlab_export_markdown_extension/labextension/package.json",
    "jupyterlab_export_markdown_extension/vendor/mermaid.min.js",
]
# Every ensured target belongs here too: the skip fires when all of these
# exist, and the ensure check runs either way - so a tree holding a
# pre-change labextension build would skip the build that creates the
# bundle, then fail on the bundle it did not create.
skip-if-exists = [
    "jupyterlab_export_markdown_extension/labextension/static/style.js",
    "jupyterlab_export_markdown_extension/labextension/package.json",
    "jupyterlab_export_markdown_extension/vendor/mermaid.min.js",
]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_export_markdown_extension/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.2.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]

